[project]
name = "trainer-object-detection"
version = "0.1.0"
description = "Object detection trainer for the Hafnia Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hafnia==0.5.4",
    "cyclopts==4.5.1",
    "rfdetr==1.4.1",
    "opencv-python<4.13", # Issues in 4.13.0.90" for small images (rfdetr requires opencv-python)
    "opencv-python-headless<4.13", # Issues in 4.13.0.90" for small images (hafnia requires opencv-python-headless)
    "pytest>=9.0.1",
]
# Adding hafnia:
# - As a package with "uv add hafnia==0.4.1"
# - As a local editable install "uv add --editable ../hafnia"
# - As a package from git - in this example the main branch: "uv add git+https://github.com/milestone-hafnia/hafnia.git@main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer_object_detection", "scripts"]


[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 120 # This should match the 'line-length' in 'pyproject.toml'
lint.select = ["C4", "E", "F","B", "I", "W", "RUF", "Q"]
